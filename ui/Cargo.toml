[package]
name = "shard-ui"
description = "Interfaz de Shard en Slint (sustituye a la app Flutter de app/)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0"

[[bin]]
name = "shard-ui"
path = "src/main.rs"

[dependencies]
lcore = { path = "../core", default-features = false }
slint = { version = "=1.19.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "renderer-femtovg",
    "accessibility",
    "system-tray",
    # Redimensionar desde el borde de la ventana sin marco (drag_resize_window).
    "unstable-winit-030",
] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time"] }
material-colors = { version = "=0.5.0", features = ["quantize"] }
# Fondos (imagen propia, favicons de servidores) y acento desde imagen.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22.1"
# Mismo tipo de mapa que `material-colors` usa en `Score::score`.
indexmap = "2.14.2"
ahash = { version = "0.8.13", default-features = false }
# Glifos de la esfera ASCII del estilo «sebaspi», pintada en CPU.
ab_glyph = "0.2.32"
# Abrir enlaces (novedades y descarga de la versión nueva).
webbrowser = "1.2.7"
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Saber si hay host de bandeja (StatusNotifierWatcher) antes de ocultar la
# ventana: Slint no avisa si no pudo crear el icono. Misma versión que ksni.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
i-slint-backend-testing = { version = "=1.19.0", features = ["renderer-software"] }
png = "0.18"

[build-dependencies]
slint-build = "=1.19.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
